name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Set package version from the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Expected a release tag in the form v<version>."
            exit 1
          fi
          npm run release -- "${RELEASE_TAG#v}"
          node scripts/sync-version.mjs --check "$RELEASE_TAG"
      - run: npm ci
      - run: npm run check
      - name: Publish scoped and unscoped packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          publish() {
            if [[ "$(npm view "$1@$version" version 2>/dev/null)" != "$version" ]]; then
              npx --yes npm@11.20.0 publish --access public --provenance --tag latest
            fi
          }

          publish @weaxs/dsh-knot
          stage="$(mktemp -d)"
          npm pack --pack-destination "$stage"
          tar -xzf "$stage"/*.tgz -C "$stage"
          cd "$stage/package"
          npm pkg set name=dsh-knot
          sed -i 's|@weaxs/dsh-knot|dsh-knot|g' cordis.patch.yml
          sed -i 's|"@weaxs/dsh-knot"|"dsh-knot"|g' dist/client.js
          grep -Eq 'name: ["'\'']dsh-knot["'\'']' cordis.patch.yml
          test -f dist/index.js
          test -f dist/client.js
          test -f icon.svg
          test -f locale/en.json
          publish dsh-knot
      - name: Deprecate the withdrawn 0.3.0 packages
        if: env.RELEASE_TAG == 'v0.2.1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm deprecate '@weaxs/dsh-knot@0.3.0' 'Withdrawn. Use 0.2.1.'
          npm deprecate 'dsh-knot@0.3.0' 'Withdrawn. Use 0.2.1.'
      - name: Create GitHub Release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
