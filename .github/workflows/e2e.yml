name: Transport Integration Tests

on:
  workflow_dispatch:
    inputs:
      transport:
        description: Transport to test
        required: true
        default: all
        type: choice
        options: [all, local, tailscale, headscale]
      target:
        description: Agent to test
        required: true
        default: all
        type: choice
        options: [all, hermes, openclaw, dsh]
      protocol:
        description: Client protocol to test
        required: true
        default: all
        type: choice
        options: [all, native, paseo]
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/e2e/**"
      - ".github/workflows/e2e.yml"
      - ".github/actions/prepare-e2e/**"
      - "scripts/**"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/e2e/**"
      - ".github/workflows/e2e.yml"
      - ".github/actions/prepare-e2e/**"
      - "scripts/**"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: transport-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL_NAME: ${{ secrets.OPENAI_MODEL_NAME }}
  OPENCLAW_GATEWAY_TOKEN: e2e-openclaw-gateway-token
  # Regional-DNS fallback for the configured OpenAI-compatible endpoint.
  E2E_MODEL_HOST: ka.vipbigmodel.cn
  E2E_MODEL_IP: 39.106.202.176

jobs:
  preflight:
    name: Check E2E credentials
    runs-on: ubuntu-latest
    outputs:
      model_configured: ${{ steps.check.outputs.model_configured }}
      tailscale_configured: ${{ steps.check.outputs.tailscale_configured }}
      matrix: ${{ steps.check.outputs.matrix }}
      has_work: ${{ steps.check.outputs.has_work }}
    steps:
      - id: check
        name: Verify required secrets
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          model=false
          tailscale=false
          if [[ -n "$OPENAI_BASE_URL" && -n "$OPENAI_API_KEY" && -n "$OPENAI_MODEL_NAME" ]]; then model=true; fi
          if [[ "$model" == true && "$TAILSCALE_AUTHKEY" == tskey-auth-* ]]; then tailscale=true; fi
          echo "model_configured=$model" >> "$GITHUB_OUTPUT"
          echo "tailscale_configured=$tailscale" >> "$GITHUB_OUTPUT"
          if [[ "$model" != true ]]; then
            message="Model E2E credentials are not configured (OPENAI_BASE_URL, OPENAI_API_KEY, OPENAI_MODEL_NAME)."
            if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then echo "::error::$message"; exit 1; else echo "::warning::$message Transport integration jobs will be skipped."; fi
          fi
          if [[ "$model" == true && "$tailscale" != true ]]; then
            message="TAILSCALE_AUTHKEY must be a reusable, ephemeral pre-auth key (tskey-auth-...). Tailscale jobs will be skipped."
            if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.transport }}" == tailscale ]]; then echo "::error::$message"; exit 1; else echo "::warning::$message"; fi
          fi

          transport_filter="${{ inputs.transport || 'all' }}"
          target_filter="${{ inputs.target || 'all' }}"
          protocol_filter="${{ inputs.protocol || 'all' }}"
          has_work=false
          matrix='{"include":['
          for transport in local tailscale headscale; do
            if [[ "$transport_filter" != all && "$transport_filter" != "$transport" ]]; then continue; fi
            if [[ "$transport" == tailscale && "$tailscale" != true ]]; then continue; fi
            for target in hermes openclaw dsh; do
              if [[ "$target_filter" != all && "$target_filter" != "$target" ]]; then continue; fi
              if [[ "$model" != true ]]; then continue; fi
              if [[ "$target" == hermes && "$transport" != local ]]; then continue; fi
              for protocol in native paseo; do
                if [[ "$target" == dsh && "$protocol" != native ]] || [[ "$target" != dsh && "$protocol" != paseo ]]; then continue; fi
                if [[ "$protocol_filter" != all && "$protocol_filter" != "$protocol" ]]; then continue; fi
                matrix+="{\"transport\":\"$transport\",\"target\":\"$target\",\"protocol\":\"$protocol\"},"
                has_work=true
              done
            done
          done
          if [[ "$has_work" != true && "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo "::error::No supported E2E cases match the selected target, transport, and protocol."
            exit 1
          fi
          echo "matrix=${matrix%,}]}" >> "$GITHUB_OUTPUT"
          echo "has_work=$has_work" >> "$GITHUB_OUTPUT"

  integration:
    name: ${{ matrix.transport }} / ${{ matrix.target }} / ${{ matrix.protocol }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    if: needs.preflight.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-e2e
      - name: Join the test tailnet
        if: matrix.transport == 'tailscale'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Run ${{ matrix.transport }} / ${{ matrix.target }} / ${{ matrix.protocol }}
        run: bash .github/e2e/scripts/run-compose.sh "${{ matrix.transport }}" "${{ matrix.target }}"
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          E2E_PROTOCOL: ${{ matrix.protocol }}
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.transport }}-${{ matrix.target }}-${{ matrix.protocol }}-logs
          path: |
            .github/e2e/generated/e2e-${{ matrix.transport }}-${{ matrix.target }}-${{ matrix.protocol }}.log
            .github/e2e/generated/adapter-${{ matrix.transport }}-${{ matrix.target }}-${{ matrix.protocol }}.log
            .github/e2e/generated/headscale-${{ matrix.target }}-${{ matrix.protocol }}-daemon.log
            .github/e2e/generated/paseo-${{ matrix.transport }}-${{ matrix.target }}-daemon.log
