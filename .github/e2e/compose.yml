x-openai-environment: &openai-environment
  OPENAI_BASE_URL: ${E2E_CONTAINER_OPENAI_BASE_URL}
  OPENAI_API_KEY: ${OPENAI_API_KEY}

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    profiles: [hermes]
    dns: [223.5.5.5, 119.29.29.29]
    extra_hosts: ["${E2E_MODEL_HOST}:${E2E_MODEL_IP}"]
    command: ["sleep", "infinity"]
    environment:
      <<: *openai-environment
      TERMINAL_ENV: local
    volumes:
      - ./generated/hermes-config.yaml:/tmp/knot-hermes-config.yaml:ro
    healthcheck:
      test: ["CMD", "test", "-x", "/opt/hermes/.venv/bin/hermes"]
      interval: 5s
      timeout: 10s
      retries: 24

  openclaw:
    image: openclaw/openclaw:latest
    profiles: [openclaw]
    dns: [223.5.5.5, 119.29.29.29]
    extra_hosts: ["${E2E_MODEL_HOST}:${E2E_MODEL_IP}"]
    entrypoint: ["tini", "-s", "--", "node", "openclaw.mjs", "gateway"]
    environment:
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_STATE_DIR: /tmp/openclaw-state
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./generated/openclaw.json:/etc/openclaw/openclaw.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(18789,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)",
        ]
      interval: 3s
      timeout: 3s
      retries: 60

  openclaw-approver:
    image: openclaw/openclaw:latest
    profiles: [openclaw]
    network_mode: service:openclaw
    depends_on:
      openclaw:
        condition: service_healthy
    environment:
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_STATE_DIR: /tmp/openclaw-state
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      - ./scripts/approve-openclaw.mjs:/e2e/approve-openclaw.mjs:ro
    command: ["node", "/e2e/approve-openclaw.mjs"]

  dsh:
    build:
      context: .
      dockerfile: dsh/Dockerfile
    profiles: [dsh]
    dns: [223.5.5.5, 119.29.29.29]
    extra_hosts: ["${E2E_MODEL_HOST}:${E2E_MODEL_IP}"]
    environment:
      OPENAI_BASE_URL: ${E2E_CONTAINER_OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME}
    volumes:
      - ./generated/dsh:/tmp/dsh-e2e
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(18790,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)",
        ]
      interval: 3s
      timeout: 3s
      retries: 80
