x-tailscale-environment: &tailscale-environment
  TS_AUTHKEY: ${TAILSCALE_AUTHKEY}
  # Let containerboot use in-memory state for short-lived test nodes.
  TS_USERSPACE: "false"
  TS_ACCEPT_DNS: "false"

x-tailscale-service: &tailscale-service
  image: tailscale/tailscale:latest
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun

services:
  hermes-tailscale:
    <<: *tailscale-service
    profiles: [hermes]
    network_mode: service:hermes
    depends_on:
      hermes:
        condition: service_healthy
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: hermes-e2e-${E2E_NODE_SUFFIX}

  openclaw-tailscale:
    <<: *tailscale-service
    profiles: [openclaw]
    network_mode: service:openclaw
    depends_on:
      openclaw:
        condition: service_healthy
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: openclaw-e2e-${E2E_NODE_SUFFIX}

  dsh-tailscale:
    <<: *tailscale-service
    profiles: [dsh]
    network_mode: service:dsh
    depends_on:
      dsh:
        condition: service_healthy
    environment:
      <<: *tailscale-environment
      TS_HOSTNAME: dsh-e2e-${E2E_NODE_SUFFIX}
