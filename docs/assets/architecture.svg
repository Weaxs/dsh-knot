<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-label="dsh-knot architecture diagram">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F7DF3"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C45FA0"/>
    </marker>
  </defs>

  <rect width="1120" height="420" rx="16" fill="#0E1324"/>
  <rect x="0.5" y="0.5" width="1119" height="419" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <!-- Section Title -->
  <text x="36" y="40" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.2">ARCHITECTURE · DIRECT PEER-TO-PEER (NO CLOUD RELAY)</text>

  <!-- Left Container: Local dsh -->
  <rect x="36" y="64" width="380" height="320" rx="14" fill="#141C33" stroke="#4F7DF3" stroke-opacity="0.45"/>
  <text x="58" y="94" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700">Local DeepSeek Harness (dsh)</text>
  <text x="58" y="114" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">@weaxs/dsh-knot plugin</text>

  <!-- Internal Layers -->
  <rect x="58" y="132" width="336" height="44" rx="9" fill="#1B2645" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="74" y="152" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Web UI + Model Tools</text>
  <text x="74" y="168" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">agent_ask · agent_continue · agent_respond · knot_doctor</text>

  <rect x="58" y="188" width="336" height="44" rx="9" fill="#1B2645" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="74" y="208" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">AgentManager + Adapters</text>
  <text x="74" y="224" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Normalized AgentEvent · Bounded jobs · Cancel &amp; Approvals</text>

  <rect x="58" y="244" width="336" height="44" rx="9" fill="#1B2645" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="74" y="264" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Transports</text>
  <text x="74" y="280" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Direct HTTP/WS · Local Loopback</text>

  <rect x="58" y="308" width="336" height="56" rx="9" fill="#231932" stroke="#C45FA0" stroke-opacity="0.5"/>
  <text x="74" y="330" fill="#F5D0E6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Separate Read-Only MCP Listener</text>
  <text x="74" y="348" fill="#D8A6C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">127.0.0.1:19400 · Deny-by-default · Constant-time Bearer · Redact</text>

  <!-- Middle Transport Channels -->
  <path d="M 416 176 L 656 176" fill="none" stroke="#4F7DF3" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <rect x="458" y="148" width="156" height="22" rx="6" fill="#18264A" stroke="#4F7DF3" stroke-opacity="0.5"/>
  <text x="536" y="163" text-anchor="middle" fill="#A5BEFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Forward: dsh → Agent</text>
  <text x="536" y="196" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Private HTTP / WebSocket</text>

  <path d="M 656 336 L 416 336" fill="none" stroke="#C45FA0" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrowRose)"/>
  <rect x="448" y="308" width="176" height="22" rx="6" fill="#2A1936" stroke="#C45FA0" stroke-opacity="0.5"/>
  <text x="536" y="323" text-anchor="middle" fill="#F1C2DF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Reverse: Agent → MCP (RO)</text>
  <text x="536" y="356" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Allow-listed sessions only</text>

  <!-- Right Container: Remote Hosts -->
  <rect x="664" y="64" width="420" height="320" rx="14" fill="#141C33" stroke="#FFFFFF" stroke-opacity="0.16"/>
  <text x="686" y="94" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700">Remote Hosts &amp; Agents</text>
  <text x="686" y="114" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">No remote plugin required</text>

  <rect x="686" y="134" width="376" height="52" rx="9" fill="#1B2645" stroke="#4F7DF3" stroke-opacity="0.45"/>
  <text x="702" y="156" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">Paseo Daemon</text>
  <text x="702" y="174" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Authenticated endpoint on a private network</text>

  <rect x="686" y="198" width="376" height="48" rx="9" fill="#1B2645" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="702" y="219" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">Hermes</text>
  <text x="702" y="236" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Paseo bundled provider</text>

  <rect x="686" y="258" width="376" height="48" rx="9" fill="#1B2645" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="702" y="279" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">OpenClaw</text>
  <text x="702" y="296" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Paseo custom provider</text>

  <rect x="686" y="318" width="376" height="48" rx="9" fill="#1B2645" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="702" y="339" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">Remote DeepSeek Harness (dsh web)</text>
  <text x="702" y="356" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">/connect cookie exchange · /api/session/* RPC</text>
</svg>
